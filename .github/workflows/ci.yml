name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # Run checks on stacked PRs as well as PRs targeting main.
    branches: ["**"]

jobs:
  backend-test:
    name: Backend Tests & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Empirical Benchmark
        run: |
          python benchmarks/run_benchmark.py

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run merchant investigation regression tests
        working-directory: apps/web
        run: npm test

      - name: Build Next.js application
        working-directory: apps/web
        run: npm run build

  frontend-browser:
    name: Merchant Browser Journey (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright test runner
        working-directory: apps/web
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FastAPI dependencies for real integration browser test
        run: python -m pip install -r apps/api/requirements.txt

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run desktop, mobile, keyboard and error-state browser journeys
        working-directory: apps/web
        env:
          CI: "true"
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-browser-traces
          path: apps/web/test-results/
          retention-days: 7
