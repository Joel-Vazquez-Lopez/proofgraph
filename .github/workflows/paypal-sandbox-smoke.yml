name: Read-only PayPal Sandbox smoke

# Explicit opt-in only; normal CI never exposes Sandbox credentials.
on:
  workflow_dispatch:
    inputs:
      dispute_id:
        description: "Optional existing Sandbox dispute ID (GET details only)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  paypal-sandbox-read-only:
    name: Backend OAuth and Disputes API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Exercise ProofGraph PayPalSandboxAdapter (no write requests)
        working-directory: apps/api
        env:
          PAYPAL_ENVIRONMENT: sandbox
          PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_SANDBOX_DISPUTE_ID: ${{ inputs.dispute_id }}
        run: python -m app.services.paypal_sandbox_smoke
