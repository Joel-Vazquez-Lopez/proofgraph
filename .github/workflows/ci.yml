name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Simulated Adaptive Investigation Demo
        run: |
          python benchmarks/demo_intelligence.py

      - name: Run Independent Adaptive Policy Challenge
        run: |
          python benchmarks/evaluate_adaptive_nbe.py

      - name: Run Empirical Benchmark
        run: |
          python benchmarks/run_benchmark.py

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js application
        working-directory: apps/web
        run: npm run build
