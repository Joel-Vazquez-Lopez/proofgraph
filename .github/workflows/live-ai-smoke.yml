name: Live OpenAI Claim Extraction (manual)

on:
  workflow_dispatch:

jobs:
  live-model-smoke:
    name: Genuine OpenAI model smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend requirements
        run: python -m pip install -r apps/api/requirements.txt
      - name: Require configured repository secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY repository secret is not configured. Live AI model NOT tested.'
            exit 1
          fi
      - name: Call actual OpenAI model through FastAPI endpoint
        env:
          AI_PROVIDER: openai
          OPENAI_MODEL: gpt-4o-mini
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_LIVE_AI_TEST: '1'
        run: pytest -v apps/api/tests/test_ai_claim_extractor.py::test_optional_live_openai_claim_extraction
